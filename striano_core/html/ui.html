	<!-- GIF VIEWER! -->
	<div id="tutorial-wrapper" style="display:none;">
		<img id="tutorial" src="" style="display:none;" />
		<p id="tutorial-text" style="display:none;"></p>
	</div>
	<script>
	window.addEventListener('message', function(event) {
		const data = event.data;
		if (!data || data.action !== 'gifViewer') return;

		const wrapper = document.getElementById('tutorial-wrapper');
		const img = document.getElementById('tutorial');
		const text = document.getElementById('tutorial-text');

		if (data.show) {
			wrapper.style.display = 'block';
			img.style.display = 'block';
			text.style.display = 'block';

			if (data.name) img.src = data.name;
			text.innerText = data.text || '';
		} else {
			wrapper.style.display = 'none';
			img.style.display = 'none';
			text.style.display = 'none';

			img.removeAttribute('src');
			text.innerText = '';
		}
	});
	</script>
